# Podcast Digest Agent — non-secret configuration.
# Secrets belong in .env / environment only (see .env.example).
# Env vars override these values: PODAGENT_<SECTION>__<KEY> (double underscore
# nests), e.g. PODAGENT_PIPELINE__DIGEST_THRESHOLD=6.
#
# Feed URLs below were each verified to return RSS with audio enclosures.
# `has_feed_transcripts: true` marks shows observed to publish
# <podcast:transcript> tags, which lets the pipeline skip ASR entirely.

podcasts:
  - slug: risky-business
    backfill_mode: full      # was the default; pinned when it changed to skip
    name: Risky Business
    feed_url: https://risky.biz/feeds/risky-business/
    priority: high
    always_escalate: true
    asr_enabled: true          # no published transcript; ASR earns its keep here
    # Dense news + interviews with thin per-episode notes — always summarize.

  - slug: security-cryptography-whatever
    backfill_mode: full      # was the default; pinned when it changed to skip
    name: Security Cryptography Whatever
    feed_url: https://feeds.buzzsprout.com/1822302.rss
    priority: high
    always_escalate: true
    asr_enabled: true          # no published transcript; ASR earns its keep here

  - slug: cloud-security-google
    backfill_mode: full      # was the default; pinned when it changed to skip
    name: Cloud Security Podcast by Google
    feed_url: https://cloudsecuritypodcast.libsyn.com/rss
    priority: high
    always_escalate: true
    asr_enabled: true          # no published transcript; ASR earns its keep here
    # NOTE: cloud.withgoogle.com/cloudsecurity/podcast/feed/ also resolves but
    # ran ~2 months stale at setup time; the Libsyn origin feed is current.

  - slug: microsoft-threat-intelligence
    backfill_mode: full      # was the default; pinned when it changed to skip
    name: Microsoft Threat Intelligence Podcast
    feed_url: https://feeds.megaphone.fm/microsoft-threat-intelligence
    priority: high
    always_escalate: true
    asr_enabled: true          # no published transcript; ASR earns its keep here

  - slug: defenders-advantage
    backfill_mode: full      # was the default; pinned when it changed to skip
    name: The Defender's Advantage Podcast
    feed_url: https://feeds.buzzsprout.com/1762840.rss
    priority: high
    always_escalate: true
    asr_enabled: true          # no published transcript; ASR earns its keep here

  - slug: cyberwire-daily
    name: CyberWire Daily
    feed_url: https://feeds.megaphone.fm/cyberwire-daily-podcast
    priority: med
    always_escalate: false
    # Daily/news cadence: stale headlines are not worth a summary (roadmap A1).
    backfill_mode: tier0_only
    # High daily volume with good descriptions — Tier-0 does the filtering.
    # The feed publishes no <podcast:transcript>, but the site does serve one —
    # on a sibling page to the one the feed links to (…/2594/notes ->
    # …/2594/transcript). Free, and better than an hour of CPU on a daily show.
    transcript_selector: ".transcript"
    transcript_url_sub: ["/notes", "/transcript"]

  - slug: sans-stormcast
    name: SANS Internet Stormcenter Daily Cyber Security Podcast
    feed_url: https://isc.sans.edu/dailypodcast.xml
    priority: med
    always_escalate: false
    # Daily/news cadence: stale headlines are not worth a summary (roadmap A1).
    backfill_mode: tier0_only
    has_feed_transcripts: true

  - slug: darknet-diaries
    backfill_mode: full      # was the default; pinned when it changed to skip
    name: Darknet Diaries
    feed_url: https://feeds.megaphone.fm/darknetdiaries
    priority: med
    always_escalate: false
    has_feed_transcripts: true
    # Publishes <podcast:transcript> in-feed, so no show-notes scraping is
    # needed (resolves design doc §14 open item — transcript_selector unused).

  - slug: ciso-series
    backfill_mode: full      # was the default; pinned when it changed to skip
    name: CISO Series Podcast
    feed_url: https://rss.libsyn.com/shows/24425/destinations/37324.xml
    priority: med
    always_escalate: false

  - slug: caveat
    name: Caveat
    feed_url: https://feeds.megaphone.fm/caveat
    priority: med
    always_escalate: false
    # Daily/news cadence: stale headlines are not worth a summary (roadmap A1).
    backfill_mode: tier0_only

  - slug: defensive-security
    backfill_mode: full      # was the default; pinned when it changed to skip
    name: Defensive Security Podcast
